    <p>东岭市交通管理部门近日发布通知，自下月起实施三项新的交通管理措施，涉及公交专用道、电动自行车停放和学校周边限速。</p>
    <p>第一项，主干道公交专用道的执行时段由原来的早晚高峰扩展为全天，社会车辆在专用道行驶将被记录。</p>
    <p>第二项，电动自行车须在划定区域停放，部分地铁站周边增设了停放点，具体位置可在市交通部门官网查询。</p>
    <p>第三项，学校周边 200 米范围内限速调整为 30 公里/小时，上学放学时段设置临时禁停。</p>
    <p>通知同时提到，措施实施初期以提醒教育为主，具体处罚标准以正式文件为准。</p>
