name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dyz-plain-talk-decoder/requirements.txt
          python -m pip install -r tests/requirements-dev.txt

      - name: Run offline unit and package-integrity tests
        run: python -m pytest -q -m "not live"

      - name: Smoke check check_env.py CLI JSON output
        run: |
          python -c "import json, subprocess, sys; r = subprocess.run([sys.executable, 'dyz-plain-talk-decoder/scripts/check_env.py'], capture_output=True, text=True, encoding='utf-8', check=True); data = json.loads(r.stdout); assert data['capabilities']['paste_text'] is True and data['capabilities']['fetch_articles'] is True"

  uv-smoke:
    name: uv run smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify PEP 723 zero-venv execution
        run: |
          uv run dyz-plain-talk-decoder/scripts/check_env.py
          uv run dyz-plain-talk-decoder/scripts/cleanup_cache.py
          uv run dyz-plain-talk-decoder/scripts/fetch_content.py "没有链接的纯文本"
          uv run dyz-plain-talk-decoder/scripts/lint_report.py --tier fast --offline < dyz-plain-talk-decoder/SKILL.md
          uv run dyz-plain-talk-decoder/scripts/render_card.py --file examples/01-self-audit-readme.md --output "${{ runner.temp }}/card-smoke.html" --title "自查样本"
